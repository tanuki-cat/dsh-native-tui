name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
      - run: pnpm check
      - name: Pack the release tarball
        run: |
          mkdir -p .tmp/release
          pnpm pack --pack-destination .tmp/release
      - name: Summarize the changelog
        run: |
          tag="$GITHUB_REF_NAME"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${tag}^" 2>/dev/null || true)"
          node --import tsx scripts/release-notes.ts --from "$previous" --to "$tag" > .tmp/release/notes.md
          if [ -n "$previous" ]; then
            printf '\n**完整变更**：https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$tag" >> .tmp/release/notes.md
          fi
          cat .tmp/release/notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --notes-file .tmp/release/notes.md --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" .tmp/release/*.tgz "${args[@]}"

  publish-npm:
    name: publish npm
    # Reserved registry path: set the NPM_PUBLISH repository variable once
    # package.json drops "private": true, declares a public name and a
    # publishConfig, and NPM_TOKEN exists. Prereleases also need a dist-tag
    # (for example --tag rc).
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
